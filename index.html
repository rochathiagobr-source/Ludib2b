<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUDI — Catálogo de Brinquedos, Decoração e Chaveiros</title>
<meta name="description" content="Catálogo LUDI: brinquedos articulados, decoração e chaveiros impressos em 3D. Monte sua seleção e envie o pedido pelo WhatsApp.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f3a8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --navy-800:#232c73;
    --navy-700:#2f3a8f;
    --orange-500:#ff751f;
    --orange-400:#ff9350;
    --yellow-500:#ffbd59;
    --whatsapp:#25d366;
    --bg:#fdf9f3;
    --surface:#ffffff;
    --ink:#1c2140;
    --muted:#6b7092;
    --line:#eae4d8;
    --shadow: 0 8px 24px rgba(35,44,115,0.10);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14172b;
      --surface:#1d2140;
      --ink:#f3f2fa;
      --muted:#a2a6c8;
      --line:#2c3159;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14172b;
    --surface:#1d2140;
    --ink:#f3f2fa;
    --muted:#a2a6c8;
    --line:#2c3159;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  h1,h2,h3,.display{
    font-family:"Baloo 2",system-ui,sans-serif;
    font-weight:700;
    margin:0;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* Topbar */
  #topbar{
    position:sticky;top:0;z-index:40;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    display:flex;align-items:center;gap:16px;
    max-width:1080px;margin:0 auto;padding:10px 16px;
  }
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex:0 0 auto;}
  .logo img{height:44px;width:auto;display:block;}
  .wa-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--whatsapp);color:#fff;
    padding:8px 14px;border-radius:999px;
    font-weight:700;font-size:0.85rem;text-decoration:none;
    white-space:nowrap;
  }
  .theme-toggle{
    background:none;border:1px solid var(--line);border-radius:999px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    color:var(--ink);font-size:1rem;flex:0 0 auto;
  }
  .topbar-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto;}
  .nav-row{
    display:flex;gap:6px;overflow-x:auto;
    flex:1 1 auto;min-width:0;padding:2px 0;
    scrollbar-width:none;
  }
  .nav-row::-webkit-scrollbar{display:none;}
  @media (max-width:480px){
    .logo img{height:34px;}
    .wa-pill{width:34px;height:34px;padding:0;justify-content:center;}
    .wa-pill .wa-label{display:none;}
  }
  .nav-chip{
    flex:0 0 auto;
    padding:7px 16px;border-radius:999px;
    font-size:0.85rem;font-weight:700;text-decoration:none;
    color:var(--muted);background:var(--bg);border:1px solid var(--line);
    white-space:nowrap;
  }
  .nav-chip.active{color:#fff;background:var(--navy-700);border-color:var(--navy-700);}

  main{max-width:1080px;margin:0 auto;padding:20px 16px 40px;}

  /* Hero */
  .hero{
    background:linear-gradient(135deg,var(--navy-700),var(--navy-800));
    color:#fff;border-radius:var(--radius-lg);
    padding:36px 24px;margin-bottom:20px;
    position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    background:var(--orange-500);opacity:0.25;border-radius:50%;
  }
  .hero h1{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15;position:relative;}
  .hero p{margin:10px 0 20px;opacity:0.9;max-width:46ch;position:relative;font-size:0.98rem;}
  .hero-ctas{display:flex;gap:10px;flex-wrap:wrap;position:relative;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:999px;border:none;
    font-weight:700;font-size:0.92rem;text-decoration:none;
  }
  .btn-primary{background:var(--whatsapp);color:#fff;}
  .btn-ghost{background:rgba(255,255,255,0.14);color:#fff;border:1px solid rgba(255,255,255,0.4);}
  .btn-orange{background:var(--orange-500);color:#fff;}

  /* Banner B2B */
  .banner-b2b{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--surface);border:1px dashed var(--orange-400);
    border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:24px;
  }
  .banner-b2b .badge{
    font-size:1.6rem;flex:0 0 auto;
    background:var(--yellow-500);width:48px;height:48px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .banner-b2b strong{font-family:"Baloo 2";font-size:1.05rem;}
  .banner-b2b p{margin:2px 0 0;color:var(--muted);font-size:0.88rem;}
  .banner-b2b.compact{padding:12px 16px;margin-bottom:18px;}
  .banner-b2b .btn{margin-left:auto;flex:0 0 auto;}

  /* Section headers */
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;}
  .section-title h2{font-size:1.3rem;}
  .section-title .count{color:var(--muted);font-size:0.85rem;}

  /* Destaques — uma linha por categoria, cada uma um carrossel horizontal */
  .destaque-row{margin-bottom:8px;}
  .destaque-row-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px;}
  .destaque-row-head h3{font-family:"Baloo 2";font-size:1.05rem;}
  .destaque-row-head .see-all{font-size:0.82rem;color:var(--muted);font-weight:700;text-decoration:none;white-space:nowrap;}
  .destaque-scroll-wrap{position:relative;}
  .destaque-scroll{
    display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;
    padding:2px 2px 6px;scrollbar-width:none;
  }
  .destaque-scroll::-webkit-scrollbar{display:none;}
  .destaque-tile{
    background:var(--surface);border-radius:var(--radius-md);
    border:1px solid var(--line);overflow:hidden;text-decoration:none;color:var(--ink);
    display:flex;flex-direction:column;
    flex:0 0 148px;scroll-snap-align:start;
  }
  @media (min-width:640px){.destaque-tile{flex-basis:180px;}}
  .destaque-tile .tile-media{
    aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:14px;
  }
  .destaque-tile .tile-media svg,.destaque-tile .tile-media img{width:70%;height:70%;object-fit:contain;}
  .destaque-tile .tile-body{padding:10px 12px 14px;}
  .destaque-tile .tile-name{
    font-family:"Baloo 2";font-weight:600;font-size:0.92rem;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .destaque-tile .tile-price{color:var(--orange-500);font-weight:800;font-size:0.9rem;margin-top:4px;}
  .destaque-scroll-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);box-shadow:var(--shadow);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;z-index:2;
  }
  .destaque-scroll-nav.prev{left:-4px;}
  .destaque-scroll-nav.next{right:-4px;}
  @media (max-width:480px){.destaque-scroll-nav{display:none;}}

  /* Selos */
  .selos{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
  .selo{
    display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:0.82rem;color:var(--muted);
  }

  /* Category header */
  .cat-header{margin:18px 0 18px;}
  .cat-header h1{font-size:1.5rem;}
  .cat-header p{color:var(--muted);margin-top:4px;font-size:0.9rem;}

  /* Product grid */
  .product-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  }
  @media (min-width:640px){.product-grid{grid-template-columns:repeat(3,1fr);}}
  @media (min-width:960px){.product-grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  .card .media{
    aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;position:relative;
  }
  .card .media svg,.card .media img{width:75%;height:75%;object-fit:contain;}
  .media-carousel{position:relative;width:100%;height:100%;overflow:hidden;touch-action:pan-y;}
  .media-track{display:flex;width:100%;height:100%;cursor:grab;}
  .media-track:active{cursor:grabbing;}
  .media-track:not(.is-dragging){transition:transform 0.32s cubic-bezier(.22,.61,.36,1);}
  .media-slide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .media-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;border:none;padding:0;
    background:rgba(20,23,43,0.3);color:#fff;font-size:1rem;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .media-nav:hover{background:rgba(20,23,43,0.55);}
  .media-nav.prev{left:6px;}
  .media-nav.next{right:6px;}
  .media-dots{
    position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
    display:flex;gap:4px;background:rgba(20,23,43,0.25);padding:4px 7px;border-radius:999px;
  }
  .media-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.55);transition:width 0.2s ease,background 0.2s ease;}
  .media-dot.active{background:#fff;width:13px;border-radius:3px;}
  .card .media.is-zoomable{cursor:zoom-in;}

  /* Ampliação de fotos — janela por cima da página, sem navegar */
  #lightbox{
    position:fixed;inset:0;z-index:80;background:rgba(10,12,26,0.92);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  #lightbox.open{display:flex;}
  .lightbox-inner{
    width:min(560px,90vw);height:min(560px,70vh);position:relative;
  }
  .lightbox-inner .media-carousel{width:100%;height:100%;border-radius:var(--radius-lg);background:rgba(255,255,255,0.04);}
  .lightbox-inner .media-nav{width:40px;height:40px;font-size:1.4rem;}
  .lightbox-inner .media-nav.prev{left:10px;}
  .lightbox-inner .media-nav.next{right:10px;}
  .lightbox-inner .media-dots{bottom:12px;padding:5px 9px;}
  .lightbox-inner .media-dot{width:6px;height:6px;}
  .lightbox-inner .media-dot.active{width:16px;}
  .lightbox-close{
    position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;
    border:none;background:rgba(255,255,255,0.12);color:#fff;font-size:1.4rem;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .lightbox-close:hover{background:rgba(255,255,255,0.22);}
  .lightbox-name{
    margin-top:16px;color:#fff;font-family:"Baloo 2";font-weight:600;font-size:1rem;text-align:center;
  }
  body.lightbox-locked{overflow:hidden;}
  .card .tag-exemplo{
    position:absolute;top:8px;left:8px;background:var(--yellow-500);color:var(--navy-800);
    font-size:0.65rem;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;
  }
  .card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card .name{font-family:"Baloo 2";font-weight:600;font-size:0.95rem;line-height:1.2;}
  .card .specs{color:var(--muted);font-size:0.72rem;line-height:1.4;min-height:1.4em;}
  .card .price{color:var(--orange-500);font-weight:800;font-size:1.02rem;margin-top:2px;}
  .card .action{margin-top:auto;padding-top:8px;}
  .btn-select{
    width:100%;background:var(--navy-700);color:#fff;border:none;border-radius:999px;
    padding:9px 10px;font-weight:700;font-size:0.82rem;
  }
  .qty-stepper{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;
  }
  .qty-stepper button{
    width:28px;height:28px;border-radius:50%;border:none;background:var(--navy-700);color:#fff;
    font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;
  }
  .qty-stepper span{font-weight:800;font-size:0.9rem;}

  .sentinel{height:1px;grid-column:1/-1;}
  .empty-msg{color:var(--muted);text-align:center;padding:40px 0;grid-column:1/-1;}

  /* Cart bar */
  #cart-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:none;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  #cart-bar.visible{display:flex;justify-content:center;}
  #cart-bar .inner{
    width:100%;max-width:520px;
    background:var(--navy-800);color:#fff;border-radius:999px;
    display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;
    box-shadow:var(--shadow);border:none;
  }
  #cart-bar .info{flex:1;text-align:left;font-size:0.85rem;}
  #cart-bar .info strong{display:block;font-family:"Baloo 2";font-size:1rem;}
  #cart-bar .open-btn{
    background:var(--orange-500);color:#fff;border:none;border-radius:999px;
    padding:10px 18px;font-weight:700;font-size:0.85rem;
  }

  /* Drawer */
  #overlay{
    position:fixed;inset:0;background:rgba(20,23,43,0.55);z-index:60;display:none;
  }
  #overlay.visible{display:block;}
  #drawer{
    position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);
    background:var(--surface);z-index:61;
    transform:translateX(100%);transition:transform 0.25s ease;
    display:flex;flex-direction:column;
  }
  #drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 12px;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.15rem;}
  .drawer-close{background:none;border:none;font-size:1.4rem;color:var(--muted);line-height:1;}
  .drawer-items{flex:1;overflow-y:auto;padding:10px 18px;}
  .drawer-item{
    display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;
  }
  .drawer-item .thumb{
    width:52px;height:52px;background:var(--bg);border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .drawer-item .thumb svg,.drawer-item .thumb img{width:70%;height:70%;object-fit:contain;}
  .drawer-item .info{flex:1;min-width:0;}
  .drawer-item .info .name{font-weight:700;font-size:0.88rem;font-family:"Baloo 2";}
  .drawer-item .info .unit{color:var(--muted);font-size:0.75rem;}
  .drawer-item .remove{background:none;border:none;color:var(--muted);font-size:0.75rem;text-decoration:underline;margin-top:4px;padding:0;}
  .drawer-item .item-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .drawer-item .line-total{font-family:"Baloo 2";font-weight:700;font-size:0.92rem;color:var(--orange-500);}
  .drawer-empty{color:var(--muted);text-align:center;padding:60px 20px;}
  .drawer-foot{padding:16px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .drawer-summary{display:flex;justify-content:space-between;align-items:baseline;font-family:"Baloo 2";font-size:1.15rem;margin-bottom:12px;color:var(--muted);}
  .drawer-summary .amount{color:var(--orange-500);font-size:1.3rem;}
  .btn-send{
    width:100%;background:var(--whatsapp);color:#fff;border:none;border-radius:999px;
    padding:13px;font-weight:800;font-size:0.95rem;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .customer-box{
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:12px 14px;margin-bottom:14px;
  }
  .customer-title{font-family:"Baloo 2";font-weight:600;font-size:0.88rem;margin-bottom:8px;}
  .customer-fields{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .customer-fields input{
    width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:inherit;font-size:0.85rem;
  }
  .btn-save-customer{
    width:100%;background:var(--navy-700);color:#fff;border:none;border-radius:999px;
    padding:10px;font-weight:700;font-size:0.85rem;
  }
  .customer-note{color:var(--muted);font-size:0.72rem;margin:8px 0 0;line-height:1.4;}
  .customer-saved{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.82rem;flex-wrap:wrap;}
  .link-btn{background:none;border:none;color:var(--navy-700);font-weight:700;font-size:0.78rem;text-decoration:underline;padding:0;flex:0 0 auto;}

  /* Footer */
  footer{
    background:var(--navy-800);color:#fff;padding:32px 16px 40px;margin-top:40px;
  }
  .footer-inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
  footer .logo{background:#fdf9f3;padding:8px 14px;border-radius:var(--radius-md);}
  footer .logo img{height:36px;}
  footer .flinks{display:flex;gap:16px;flex-wrap:wrap;font-size:0.85rem;}
  footer .flinks a{text-decoration:none;opacity:0.85;}
  footer .fnote{font-size:0.78rem;opacity:0.65;max-width:60ch;}

  @media (max-width:480px){
    .banner-b2b .btn{margin-left:0;}
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="topbar-row">
    <a href="#/" class="logo" id="logo-slot" aria-label="LUDI — início"><img src="assets/logo-ludi.svg" alt="LUDI"></a>
    <nav class="nav-row" id="nav-row" aria-label="Categorias"></nav>
    <div class="topbar-actions">
      <button class="theme-toggle" id="theme-toggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">🌓</button>
      <a class="wa-pill" id="topbar-wa" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
        <span aria-hidden="true">💬</span><span class="wa-label"> WhatsApp</span>
      </a>
    </div>
  </div>
</div>

<main id="app"></main>

<div id="cart-bar">
  <div class="inner">
    <div class="info" id="cart-bar-info"></div>
    <button class="open-btn" id="cart-bar-open">Ver seleção</button>
  </div>
</div>

<div id="overlay"></div>
<aside id="drawer" aria-label="Carrinho de seleção">
  <div class="drawer-head">
    <h2>Sua seleção</h2>
    <button class="drawer-close" id="drawer-close" aria-label="Fechar">×</button>
  </div>
  <div class="drawer-items" id="drawer-items"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<div id="lightbox" aria-label="Fotos ampliadas do produto" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Fechar">×</button>
  <div class="lightbox-inner">
    <div class="media-carousel" id="lightbox-carousel"></div>
  </div>
  <div class="lightbox-name" id="lightbox-name"></div>
</div>

<footer>
  <div class="footer-inner">
    <a href="#/" class="logo" id="footer-logo-slot" aria-label="LUDI — início"><img src="assets/logo-ludi.svg" alt="LUDI"></a>
    <div class="flinks">

    // Olist às vezes só preenche uma dessas medidas, variando por produto.
    var dimensoes = [
      { valor: parseFloat(String(pick(row, ["Altura Embalagem"])).replace(",",".")) || 0, label: "Alt." },
      { valor: parseFloat(String(pick(row, ["Largura Embalagem"])).replace(",",".")) || 0, label: "Larg." },
      { valor: parseFloat(String(pick(row, ["Comprimento Embalagem"])).replace(",",".")) || 0, label: "Compr." }
    ];
    var maior = dimensoes.reduce(function(acc, d){ return d.valor > acc.valor ? d : acc; }, { valor: 0, label: "" });
    return maior.valor > 0 ? (maior.label + " " + maior.valor + " cm") : "";
  }
  var TITLECASE_MINUSCULAS = ["de","da","do","das","dos","e","em"];
  function toTitleCase(str){
    var trimmed = String(str || "").trim();
    // O Olist exporta nome de produto em CAIXA ALTA — normaliza só quem vem
    // assim; um nome já digitado com case próprio (produtos.csv simples) fica
    // do jeito que está.
    if (!trimmed || trimmed !== trimmed.toUpperCase()) return trimmed;
    return trimmed.toLowerCase().split(" ").map(function(word, i){
      if (!word) return word;
      if (i > 0 && TITLECASE_MINUSCULAS.indexOf(word) !== -1) return word;
      return word.charAt(0).toUpperCase() + word.slice(1);
    }).join(" ");
  }
  function stripAccents(str){
    return String(str || "").normalize("NFD").replace(new RegExp("[̀-ͯ]", "g"), "");
  }
  function normalizeCategoria(raw){
    // Só tolera variação de escrita (maiúscula/minúscula, acento, singular/
    // plural) — uma categoria de verdade diferente (ex.: "Decorativos",
    // "Vestuário") tem que ficar de fora, não "parecer" com uma das 3.
    var first = String(raw || "").split(">")[0];
    var norm = stripAccents(first).trim().toLowerCase().replace(/s$/, "");
    if (norm === "brinquedo") return "brinquedos";
    if (norm === "decoracao") return "decoracao";
    if (norm === "chaveiro") return "chaveiros";
    return norm; // não bate com nenhuma das 3 — produto fica de fora do site
  }
  function isAtivo(row){
    var simples = pick(row, ["ativo"]);
    if (simples) return stripAccents(simples).trim().toLowerCase() !== "nao";
    var situacao = pick(row, ["Situação", "Situacao"]);
    if (situacao) return stripAccents(situacao).trim().toLowerCase() === "ativo";
    return true; // sem coluna de status nenhuma, assume ativo
  }

  function buildCatalog(rows){
    var catalog = { brinquedos:[], decoracao:[], chaveiros:[] };
    var byId = {};
    rows.forEach(function(row){
      if (!row) return;
      var nome = toTitleCase(pick(row, ["nome", "Descrição", "Descricao"]));
      var sku = pick(row, ["sku", "Código (SKU)", "Codigo (SKU)"]) || slugify(nome);
      if (!sku || !nome) return;
      if (!isAtivo(row)) return;
      var categoria = normalizeCategoria(pick(row, ["categoria", "Categoria"]));
      if (!catalog[categoria]) return;
      var maiorMedida = maiorMedidaEmbalagem(row);
      var imagens = pickAllImages(row);
      var product = {
        sku: sku,
        nome: nome,
        categoria: categoria,
        preco: parseFloat(String(pick(row, ["preco", "Preço", "Preco"])).replace(",",".")) || 0,
        tamanho: pick(row, ["tamanho"]) || maiorMedida,
        peso_kg: pick(row, ["peso_kg", "Peso líquido (Kg)", "Peso liquido (Kg)"]),
        descricao: pick(row, ["descricao", "Descrição complementar", "Descricao complementar"]),
        imagens: imagens,
        imagem_url: imagens[0] || "",
        destaque: stripAccents(pick(row, ["destaque"])).trim().toLowerCase() === "sim",
        exemplo: stripAccents(pick(row, ["exemplo"])).trim().toLowerCase() === "sim"
      };
      catalog[categoria].push(product);
      byId[product.sku] = product;
    });
    return { catalog: catalog, byId: byId };
  }

  function loadData(){
    return fetch("produtos.csv", { cache: "no-store" }).then(function(res){
      if (!res.ok) throw new Error("csv not ok");
      return res.text();
    }).then(function(text){
      var parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
      if (!parsed.data || !parsed.data.length) throw new Error("csv empty");
      return parsed.data;
    }).catch(function(){
      return DEFAULT_ROWS;
    });
  }

  function trackAddToCart(sku){
    if (!SHEET_WEBHOOK_URL) return;

  /* ============ POPULARIDADE (pra o carrossel de destaques) ============
   * Lê, via JSONP (contorna CORS de um domínio pro outro sem precisar de
   * servidor próprio), quantas vezes cada produto foi adicionado ao
   * carrinho — agregado de todo mundo que já usou o site, gravado pelo
   * Apps Script (aba "Populares"). Sem webhook configurado, ou sem dados
   * ainda, o carrossel simplesmente sorteia a ordem.
   */
  var popularidadeCache = null;
  function fetchPopularidade(onDone){
    if (!SHEET_WEBHOOK_URL) { onDone({}); return; }
    var cbName = "__ludiPop" + Date.now();
    var script = document.createElement("script");
    var finished = false;
    function finish(data){
      if (finished) return;
      finished = true;
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      onDone(data || {});
    }
    window[cbName] = finish;
    script.onerror = function(){ finish({}); };
    script.src = SHEET_WEBHOOK_URL + (SHEET_WEBHOOK_URL.indexOf("?") === -1 ? "?" : "&") + "callback=" + cbName;
    setTimeout(function(){ finish({}); }, 5000);
    document.body.appendChild(script);
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function rankByPopularidade(items, popCounts){
    var counted = items.map(function(p){
      return { product: p, count: (popCounts[p.sku] && popCounts[p.sku].count) || 0 };
    });
    var hasData = counted.some(function(x){ return x.count > 0; });
    if (!hasData) return shuffle(items);
    // embaralha antes pra desempatar aleatoriamente, depois ordena por contagem
    return shuffle(counted).sort(function(a, b){ return b.count - a.count; }).map(function(x){ return x.product; });
  }

  function loadCart(){
    try {
      var raw = localStorage.getItem(CART_STORAGE_KEY);

    } catch(e){ return {}; }

  function setQty(sku, qty){
    var isNewAdd = !cart[sku] && qty > 0;
    if (qty <= 0) { delete cart[sku]; }
    else { cart[sku] = qty; }
    if (isNewAdd) trackAddToCart(sku);

    renderCartBar();

    refreshVisibleCardControls();

  }
  function cartTotal(){
    return Object.keys(cart).reduce(function(sum,sku){
      var p = ALL_PRODUCTS[sku];
      return sum + (p ? p.preco * cart[sku] : 0);
    }, 0);

  /* ============ CARROSSEL DE FOTOS (reaproveitado no card e na ampliação) ============
   * Setas semi-transparentes + arraste (mouse ou touch) pra trocar de foto —
   * usado tanto no carrossel pequeno do card quanto na janela de ampliação.
   */
  function wireCarousel(carousel, opts){
    opts = opts || {};
    var track = carousel.querySelector(".media-track");
    var dots = carousel.querySelectorAll(".media-dot");
    var count = carousel.querySelectorAll(".media-slide").length;
    var index = opts.startIndex || 0;
    var width = carousel.clientWidth;

    function place(){
      track.style.transform = "translateX(" + (-index * width) + "px)";
      dots.forEach(function(d, i){ d.classList.toggle("active", i === index); });
      if (opts.onChange) opts.onChange(index);
    }
    function goTo(newIndex){
      index = (newIndex + count) % count;
      track.classList.remove("is-dragging");
      place();
    }
    place();

    carousel.querySelector(".media-nav.prev").addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      goTo(index - 1);
    });
    carousel.querySelector(".media-nav.next").addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      goTo(index + 1);
    });
    dots.forEach(function(dot, i){
      dot.addEventListener("click", function(ev){
        ev.preventDefault(); ev.stopPropagation();
        goTo(i);
      });
    });

    var dragging = false, axisLocked = null, startX = 0, startY = 0, deltaX = 0, pointerId = null;
    track.addEventListener("pointerdown", function(ev){
      if (ev.button !== undefined && ev.button !== 0) return;
      pointerId = ev.pointerId;
      startX = ev.clientX; startY = ev.clientY; deltaX = 0; axisLocked = null; dragging = true;
      carousel._wasDragged = false;
      width = carousel.clientWidth;
    });
    track.addEventListener("pointermove", function(ev){
      if (!dragging || ev.pointerId !== pointerId) return;
      var dx = ev.clientX - startX;
      var dy = ev.clientY - startY;
      if (axisLocked === null){
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axisLocked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
        if (axisLocked === "x") track.setPointerCapture(pointerId);
      }
      if (axisLocked !== "x") return;
      ev.preventDefault();
      deltaX = dx;
      carousel._wasDragged = true;
      track.classList.add("is-dragging");
      track.style.transform = "translateX(" + (-index * width + deltaX) + "px)";
    });
    function endDrag(){
      if (!dragging) return;
      dragging = false;
      if (axisLocked === "x"){
        var threshold = width * 0.18;
        if (deltaX <= -threshold) goTo(index + 1);
        else if (deltaX >= threshold) goTo(index - 1);
        else goTo(index);
      }
      axisLocked = null; deltaX = 0;
    }
    track.addEventListener("pointerup", endDrag);
    track.addEventListener("pointercancel", endDrag);
    window.addEventListener("resize", function(){
      width = carousel.clientWidth;
      track.style.transform = "translateX(" + (-index * width) + "px)";
    });

    var api = {
      goTo: goTo,
      getIndex: function(){ return index; },
      refreshWidth: function(){ width = carousel.clientWidth; place(); }
    };
    carousel._carouselApi = api;
    return api;
  }

  function initCardCarousels(root){
    root.querySelectorAll('.media-carousel').forEach(function(carousel){
      if (carousel.dataset.carouselInit) return;
      carousel.dataset.carouselInit = "1";
      wireCarousel(carousel);
    });
  }

  /* ============ AMPLIAÇÃO DE FOTOS (janela na mesma página) ============
   * Clicar na foto do produto (sem ter arrastado o carrossel) abre uma
   * visualização maior, com o mesmo carrossel — sem navegar pra lugar
   * nenhum. As setinhas pequenas do card continuam funcionando normalmente.
   */
  function slidesHtml(imgs, nome){
    var slides = imgs.map(function(url){
      return '<div class="media-slide"><img src="'+escapeAttr(url)+'" alt="'+escapeAttr(nome)+'" loading="lazy"></div>';
    }).join("");
    var dots = imgs.length > 1 ? '<div class="media-dots">' + imgs.map(function(_, i){
      return '<span class="media-dot' + (i === 0 ? ' active' : '') + '"></span>';
    }).join("") + '</div>' : '';
    var navs = imgs.length > 1
      ? '<button type="button" class="media-nav prev" aria-label="Foto anterior">‹</button>' +
        '<button type="button" class="media-nav next" aria-label="Próxima foto">›</button>'
      : '';
    return '<div class="media-track">' + slides + '</div>' + navs + dots;
  }
  function openLightbox(product, startIndex){
    var imgs = product.imagens || [];
    if (!imgs.length) return;
    var lightbox = document.getElementById("lightbox");
    var carousel = document.getElementById("lightbox-carousel");
    carousel.innerHTML = slidesHtml(imgs, product.nome);
    delete carousel.dataset.carouselInit;
    document.getElementById("lightbox-name").textContent = product.nome;
    lightbox.classList.add("open");
    document.body.classList.add("lightbox-locked");
    // clientWidth só fica correto depois que a janela já está visível
    requestAnimationFrame(function(){
      carousel.dataset.carouselInit = "1";
      wireCarousel(carousel, { startIndex: Math.min(startIndex || 0, imgs.length - 1) });
    });
  }
  function closeLightbox(){
    document.getElementById("lightbox").classList.remove("open");
    document.body.classList.remove("lightbox-locked");
  }
  function bindMediaZoom(root){
    root.querySelectorAll(".card[data-sku]").forEach(function(card){
      var media = card.querySelector(".media");
      if (!media || media.dataset.zoomInit) return;
      var sku = card.getAttribute("data-sku");
      var product = ALL_PRODUCTS[sku];
      if (!product || !(product.imagens && product.imagens.length)) return;
      media.dataset.zoomInit = "1";
      media.classList.add("is-zoomable");
      media.addEventListener("click", function(){
        var carouselEl = media.querySelector(".media-carousel");
        if (carouselEl && carouselEl._wasDragged) return;
        var startIndex = carouselEl && carouselEl._carouselApi ? carouselEl._carouselApi.getIndex() : 0;
        openLightbox(product, startIndex);
      });
    });
  }

  /* ============ RENDER: BANNER B2B ============ */
  function renderBanner(compact){
    return '<div class="banner-b2b' + (compact ? ' compact' : '') + '">' +
      '<div class="badge">🏬</div>' +
      '<div>' +
        '<strong>Compras acima de 60 peças</strong>' +
        '<p>Expositor em comodato para lojistas, museus, escolas e zoológicos.</p>' +
      '</div>' +
      '<a class="btn btn-orange" href="' + waLink("Olá! Tenho interesse na condição B2B (60+ peças / expositor em comodato) do catálogo LUDI.") + '" target="_blank" rel="noopener">Falar no WhatsApp</a>' +
    '</div>';
  }

  /* ============ RENDER: HOME ============ */
  function renderHome(){
    var html = '';
    html += '<section class="hero">' +
      '<h1>Brinquedos, decoração e chaveiros direto da impressora 3D</h1>' +
      '<p>Monte sua seleção no catálogo e envie o pedido pelo WhatsApp. O fechamento — pagamento e entrega — é combinado direto com a gente.</p>' +
      '<div class="hero-ctas">' +
        '<a class="btn btn-primary" href="' + waLink() + '" target="_blank" rel="noopener">💬 Falar no WhatsApp</a>' +
        '<a class="btn btn-ghost" href="#/brinquedos">Ver catálogo</a>' +
      '</div>' +
    '</section>';

    html += renderBanner(false);

    html += '<div class="section-title"><h2>Destaques</h2><span class="count">mais adicionados ao carrinho</span></div>';
    CATEGORY_ORDER.forEach(function(cat){
      var items = CATALOG[cat] || [];
      if (!items.length) return;
      html += renderDestaqueRow(cat, items);
    });

    html += '<div class="selos">' +
      '<div class="selo">🖨️ Impressão 3D própria</div>' +
      '<div class="selo">🤝 Pedido fechado no WhatsApp</div>' +
      '<div class="selo">📦 Ideal para revenda e consignação</div>' +
    '</div>';

    return html;
  }

  /* ============ DESTAQUES: uma linha por categoria ============
   * Cada categoria tem sua própria linha fixa — assim nenhuma categoria
   * some dos destaques só porque outra vende mais. Dentro da linha, os
   * produtos vêm em ordem de popularidade (ou aleatória, sem dado ainda),
   * e clicar em qualquer foto leva pra página daquela categoria.
   */
  function destaqueTileHtml(p, cat){
    var media = p.imagem_url ? '<img src="'+escapeAttr(p.imagem_url)+'" alt="'+escapeAttr(p.nome)+'" loading="lazy">' : iconFor(p);
    return '<a class="destaque-tile" href="#/' + cat + '">' +
      '<div class="tile-media">' + media + '</div>' +
      '<div class="tile-body">' +
        '<div class="tile-name">' + escapeHtml(p.nome) + '</div>' +
        '<div class="tile-price">' + formatBRL(p.preco) + '</div>' +
      '</div>' +
    '</a>';
  }
  function renderDestaqueRow(cat, items){
    var ranked = rankByPopularidade(items, popularidadeCache || {});
    var tiles = ranked.map(function(p){ return destaqueTileHtml(p, cat); }).join("");
    return '<div class="destaque-row" data-cat="' + cat + '">' +
      '<div class="destaque-row-head">' +
        '<h3>' + CATEGORY_META[cat].label + '</h3>' +
        '<a class="see-all" href="#/' + cat + '">Ver tudo</a>' +
      '</div>' +
      '<div class="destaque-scroll-wrap">' +
        '<div class="destaque-scroll">' + tiles + '</div>' +
        '<button type="button" class="destaque-scroll-nav prev" aria-label="Ver anteriores">‹</button>' +
        '<button type="button" class="destaque-scroll-nav next" aria-label="Ver próximos">›</button>' +
      '</div>' +
    '</div>';
  }
  function initDestaqueRows(){
    var rows = document.querySelectorAll(".destaque-row");
    if (!rows.length) return;

    rows.forEach(function(rowEl){
      var scroll = rowEl.querySelector(".destaque-scroll");
      rowEl.querySelector(".destaque-scroll-nav.prev").addEventListener("click", function(){
        scroll.scrollBy({ left: -scroll.clientWidth * 0.7, behavior: "smooth" });
      });
      rowEl.querySelector(".destaque-scroll-nav.next").addEventListener("click", function(){
        scroll.scrollBy({ left: scroll.clientWidth * 0.7, behavior: "smooth" });
      });
    });

    // Popularidade real (se houver) chega de forma assíncrona — quando vier,
    // reordena cada linha (sem isso, fica na ordem sorteada inicial).
    if (popularidadeCache){
      applyPopularidadeAosDestaques(popularidadeCache);
    } else {
      fetchPopularidade(function(data){
        popularidadeCache = data;
        applyPopularidadeAosDestaques(data);
      });
    }
    function applyPopularidadeAosDestaques(popCounts){
      if (!popCounts || !Object.keys(popCounts).length) return;
      rows.forEach(function(rowEl){
        var cat = rowEl.getAttribute("data-cat");
        var ranked = rankByPopularidade(CATALOG[cat] || [], popCounts);
        var scroll = rowEl.querySelector(".destaque-scroll");
        scroll.innerHTML = ranked.map(function(p){ return destaqueTileHtml(p, cat); }).join("");
        scroll.scrollLeft = 0;
      });
    }
  }

  /* ============ RENDER: CATEGORIA (com scroll infinito) ============ */
  function renderCategory(cat){
    var meta = CATEGORY_META[cat];
    var items = CATALOG[cat] || [];
    currentPage[cat] = 1;

    var html = '<div class="cat-header">' +
      '<h1>' + meta.label + '</h1>' +
      '<p>' + items.length + ' ' + (items.length === 1 ? 'produto' : 'produtos') + '</p>' +
    '</div>';
    html += renderBanner(true);
    html += '<div class="product-grid" id="product-grid">';
    if (!items.length){
      html += '<div class="empty-msg">Nenhum produto ativo nesta categoria no momento.</div>';
    } else {
      items.slice(0, PAGE_SIZE).forEach(function(p){ html += productCardHtml(p); });
      if (items.length > PAGE_SIZE) html += '<div class="sentinel" id="scroll-sentinel"></div>';
    }
    html += '</div>';
    return html;
  }

  function setupInfiniteScroll(cat){
    if (stopInfiniteScrollWatch) { stopInfiniteScrollWatch(); stopInfiniteScrollWatch = null; }
    var sentinel = document.getElementById("scroll-sentinel");
    if (!sentinel) return;

    function loadNextBatch(){
      var items = CATALOG[cat] || [];
      currentPage[cat] += 1;
      var upTo = currentPage[cat] * PAGE_SIZE;
      var grid = document.getElementById("product-grid");
      if (!grid) return false;
      var nextBatch = items.slice(upTo - PAGE_SIZE, upTo);
      var frag = document.createElement("div");
      frag.innerHTML = nextBatch.map(productCardHtml).join("");
      while (frag.firstChild) grid.insertBefore(frag.firstChild, sentinel);
      bindCardActions(grid);
      if (upTo >= items.length){
        stopWatching();
        sentinel.remove();
        return false;
      }
      return true;
    }

    function fillWhileVisible(){
      var rect = sentinel.getBoundingClientRect();
      var stillHasMore = true;
      while (stillHasMore && rect.top < window.innerHeight + 200){
        stillHasMore = loadNextBatch();
        if (!document.body.contains(sentinel)) break;
        rect = sentinel.getBoundingClientRect();
      }
    }

    // IntersectionObserver só reavisa quando a sentinela CRUZA o limite de
    // visibilidade. Em telas altas o lote inicial já pode preencher a tela
    // inteira, e a sentinela fica "presa" sempre visível sem nunca cruzar o
    // limite de novo — então o observer nunca dispara uma segunda vez. Por
    // isso usamos o observer só como gatilho inicial (economiza CPU quando a
    // sentinela está longe) e reforçamos com scroll/resize, que reavaliam a
    // posição a cada evento em vez de depender de uma mudança de estado.
    var ticking = false;
    function onScrollOrResize(){
      if (ticking) return;
      ticking = true;
      setTimeout(function(){ fillWhileVisible(); ticking = false; }, 80);
    }
    scrollObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) fillWhileVisible();
      });
    }, { rootMargin: "200px" });
    scrollObserver.observe(sentinel);
    window.addEventListener("scroll", onScrollOrResize, { passive: true });
    window.addEventListener("resize", onScrollOrResize);
    function stopWatching(){
      scrollObserver.disconnect();
      window.removeEventListener("scroll", onScrollOrResize);
      window.removeEventListener("resize", onScrollOrResize);
    }
    stopInfiniteScrollWatch = stopWatching;
    fillWhileVisible();
  }

  /* ============ ROUTER ============ */
  var ROUTES = { "": renderHome, "brinquedos": renderCategory, "decoracao": renderCategory, "chaveiros": renderCategory };

  function currentRoute(){
    var hash = window.location.hash.replace(/^#\/?/, "");
    return hash.split("?")[0].split("/")[0] || "";
  }

  function renderApp(){
    var route = currentRoute();
    var app = document.getElementById("app");
    if (stopInfiniteScrollWatch) { stopInfiniteScrollWatch(); stopInfiniteScrollWatch = null; }
    if (route === "" ){
      app.innerHTML = renderHome();
      initDestaqueRows();
    } else if (CATEGORY_META[route]){
      app.innerHTML = renderCategory(route);
      setupInfiniteScroll(route);
    } else {
      window.location.hash = "#/";
      return;
    }
    bindCardActions(app);
    updateNav(route);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function updateNav(route){
    document.querySelectorAll(".nav-chip").forEach(function(chip){
      chip.classList.toggle("active", chip.getAttribute("data-route") === route);
    });
  }

  function renderNav(){
    var nav = document.getElementById("nav-row");
    var items = [{route:"", label:"Início"}].concat(CATEGORY_ORDER.map(function(cat){
      return { route: cat, label: CATEGORY_META[cat].label };
    }));
    nav.innerHTML = items.map(function(it){
      return '<a class="nav-chip" data-route="' + it.route + '" href="#/' + it.route + '">' + it.label + '</a>';
    }).join("");
  }

  /* ============ TEMA ============ */
  function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem(THEME_STORAGE_KEY); } catch(e){}
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    document.getElementById("theme-toggle").addEventListener("click", function(){
      var current = document.documentElement.getAttribute("data-theme");
      var isDark = current ? current === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_STORAGE_KEY, next); } catch(e){}
    });
  }

  /* ============ INIT ============ */
  function init(){
    document.getElementById("topbar-wa").href = waLink();
    document.getElementById("footer-wa").href = waLink();
    renderNav();
    initTheme();

    document.getElementById("cart-bar-open").addEventListener("click", openDrawer);
    document.getElementById("drawer-close").addEventListener("click", closeDrawer);
    document.getElementById("overlay").addEventListener("click", closeDrawer);

    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    document.getElementById("lightbox").addEventListener("click", function(ev){
      if (ev.target.id === "lightbox") closeLightbox();
    });
    document.addEventListener("keydown", function(ev){
      if (ev.key === "Escape" && document.getElementById("lightbox").classList.contains("open")) closeLightbox();
    });

    loadData().then(function(rows){
      var built = buildCatalog(rows);
      CATALOG = built.catalog;
      ALL_PRODUCTS = built.byId;
      renderApp();
      renderCartBar();
    });

    window.addEventListener("hashchange", renderApp);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
